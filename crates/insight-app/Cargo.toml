[package]
name = "insight-app"
description = "insight-app.exe: the window (ADR-0031). Owns the backend and serves it to `insight mcp`."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "insight-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
insight-mcp.workspace = true
anyhow = "1.0.104"
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["io-util", "net", "sync"] }
