[package]
name = "insight-cli"
description = "insight.exe: the CLI (and, from M2, the MCP stdio bridge)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "insight"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
insight-engine = { version = "0.1.0", path = "../insight-engine" }
insight-solver = { path = "../insight-solver" }
